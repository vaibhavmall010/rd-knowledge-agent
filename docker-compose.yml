# docker compose up            -> app on http://localhost:8501, Ollama on :11434
# first run: docker compose exec ollama ollama pull llama3.1
services:
  ollama:
    image: ollama/ollama:latest
    ports: ["11434:11434"]
    volumes: [ollama:/root/.ollama]

  app:
    build: .
    ports: ["8501:8501"]
    environment:
      OLLAMA_HOST: http://ollama:11434
      RDAGENT_MODEL: ${RDAGENT_MODEL:-llama3.1}
    depends_on: [ollama]

volumes:
  ollama:
