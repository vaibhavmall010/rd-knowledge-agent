    expected_tools: [[compliance_summary, check_spec]]
    oracle: [{tool: compliance_summary, args: {product: OV-600B}}]
    facts: [["7 of 7", "all 7", "all seven", "all requirements", "all of its requirements", "meets all", "passes all"]]
    oracle_facts: ["7 of 7"]
    must_cite: [[TR-2026-031, TR-2026-034, TR-2026-047, TR-2026-052, TR-2026-061, MEET-2026-09-10, SPEC-OV600-001]]

