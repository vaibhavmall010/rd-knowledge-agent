    oracle: [{tool: search_documents, args: {query: OV-600S preheat time deviation decisions platform review}}]
    facts: [["deviation"], "7.7"]
    must_cite: [[MEET-2026-09-10]]

  - id: q13
    category: lookup
    question: Did we see the fan tone problem on a previous platform, and what was recommended?
    expected_tools: [[search_documents, get_document]]
    oracle: [{tool: search_documents, args: {query: fan tone previous platform lessons learned}}]
    facts: ["OV-500", ["unequal"]]
    must_cite: [[LL-2025-009]]

  - id: q14
