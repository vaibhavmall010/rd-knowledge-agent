# Evaluation set for the R&D knowledge agent.
#
# Fields
#   expected_tools  list of groups; the agent must call at least one tool from every group
#   oracle          the tool calls an expert would make; used by the model-free tool-layer check
#   facts           each entry must appear in the answer; a nested list means "any of these"
#   oracle_facts    optional override of facts for the tool-layer check
#   must_cite       list of groups; the answer must cite at least one id from every group
#   answerable      false = the correct answer is a refusal

questions:
  - id: q01
    category: lookup
    question: What is the fan noise limit for the OV-600 platform and how is it measured?
    expected_tools: [[search_documents, get_document, check_spec]]
    oracle: [{tool: search_documents, args: {query: fan noise limit measured}}]
    facts: ["52.0", ["1 m", "1 metre", "1 meter"]]
    must_cite: [[SPEC-OV600-001]]

  - id: q02
    category: compliance
    question: Does the OV-600P currently meet the fan noise requirement?
    expected_tools: [[check_spec, compliance_summary]]
    oracle: [{tool: check_spec, args: {product: OV-600P, parameter: fan_noise}}]
    facts: ["51.2", "52.0"]
    must_cite: [[TR-2026-047]]

  - id: q03
    category: multi_hop
    question: What caused the original fan noise failure on the OV-600P and what fixed it?
    expected_tools: [[search_documents, get_document]]
    oracle: [{tool: search_documents, args: {query: OV-600P fan noise tone 216 Hz blade-pass fix}}]
    facts: ["216", "ECR-0117", ["9-blade", "9 blade", "nine-blade", "nine blade", "unequal"]]
    must_cite: [[TR-2026-040, ECR-0117]]

  - id: q04
    category: measurement
    question: What fan-forced energy consumption was measured on the OV-600S before and after the fan baffle change?
    expected_tools: [[query_test_results, check_spec]]
    oracle: [{tool: query_test_results, args: {product: OV-600S, parameter: energy_fan_forced}}]
    facts: ["0.88", "0.84"]
    must_cite: [[TR-2026-034], [TR-2026-066]]

  - id: q05
    category: compliance
    question: Which OV-600S requirements are still not met?
    expected_tools: [[compliance_summary, check_spec]]
    oracle: [{tool: compliance_summary, args: {product: OV-600S}}]
    facts: [["preheat"], "7.6", ["hinge"], "26500", ["descal"], "120"]
    must_cite: [[TR-2026-066], [TR-2026-061], [TR-2026-058]]

  - id: q06
    category: change
    question: What is the status of ECR-0123?
    expected_tools: [[get_document, list_change_requests, search_documents]]
    oracle: [{tool: get_document, args: {doc_id: ECR-0123}}]
    facts: [["open"], ["q4 2026"]]
    must_cite: [[ECR-0123]]

  - id: q07
    category: change
    question: Which change requests are still open or in review?
    expected_tools: [[list_change_requests]]
    oracle: [{tool: list_change_requests, args: {}}]
    facts: ["ECR-0123", "ECR-0125"]
    must_cite: [[ECR-0123], [ECR-0125]]

  - id: q08
    category: measurement
    question: How many hinge cycles did the OV-600S reach and why did it fail?
    expected_tools: [[query_test_results, check_spec, search_documents, get_document, compliance_summary]]
    oracle:
      - {tool: query_test_results, args: {product: OV-600S, parameter: hinge_cycles}}
      - {tool: get_document, args: {doc_id: TR-2026-061}}
    facts: ["26500", ["spring"]]
    must_cite: [[TR-2026-061]]

  - id: q09
    category: lookup
    question: What does the specification require for the steam generator?
    expected_tools: [[search_documents, get_document]]
    oracle: [{tool: search_documents, args: {query: steam generator requirement descaling}}]
    facts: ["150", "3.5"]
    must_cite: [[SPEC-OV600-001]]

  - id: q10
    category: multi_hop
    question: Based on the simulation, would the ECR-0125 coating bring the OV-600P pyrolysis door temperature within the limit?
    expected_tools: [[check_spec, query_test_results, search_documents], [get_document, search_documents]]
    oracle:
      - {tool: check_spec, args: {product: OV-600P, parameter: door_temp_rise_pyrolysis}}
      - {tool: get_document, args: {doc_id: ECR-0125}}
    facts: ["63.4", "60.0", ["5 to 7", "5-7", "5–7"]]
    must_cite: [[TR-2026-052], [ECR-0125]]

  - id: q11
    category: lookup
    question: When is the platform release gate now?
    expected_tools: [[search_documents, get_document]]
