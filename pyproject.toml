[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rdagent"
version = "0.1.0"
description = "Tool-calling LLM agent that answers R&D questions from specifications, test data and change requests, with checked citations and an evaluation harness."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
# Pure-Python core: no compiled packages needed, so it also runs on locked-down Windows machines.
dependencies = [
    "pyyaml>=6.0",
]

[project.optional-dependencies]
app = ["streamlit>=1.35"]
dev = ["pytest>=8.0", "ruff>=0.5"]

[project.scripts]
rdagent-ask = "rdagent.cli:main"
rdagent-eval = "rdagent.evaluate:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
